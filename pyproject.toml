[project]
name = "walkbike-routes"
version = "0.1.0"
description = "Where walking, cycling and driving trips to a destination would go, from public US data and published route-choice models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Geoff Davis" }]
requires-python = ">=3.12"
classifiers = ["Development Status :: 3 - Alpha"]
dependencies = [
    "geopandas>=1.0",
    "httpx>=0.27",
    "networkx>=3.3",
    "numpy>=2.0",
    "osmium>=4.3.2",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "shapely>=2.0",
    "tenacity>=9.0",
]

[project.scripts]
walkbike-routes = "walkbike_routes.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/walkbike_routes"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
    "types-geopandas>=1.0",
    "types-networkx>=3.3",
    "types-pyyaml>=6.0",
    "types-shapely>=2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
show_error_codes = true

# Tests are type-checked, but need not annotate every helper.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["scipy.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
