<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>/*TITLE*/ · route access map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f5f2;--fg:#1d2126;--muted:#5d646c;--line:#d5d3cd;--panel:#ffffff;--warn-bg:#fff3d6;--warn-fg:#5c4300;
--walk:#7a3fb8;--bike:#c8342a;--car:#2563c9;--hi:#ffe066;--first:#111111;--watch:#f0a500}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.warn{background:var(--warn-bg);color:var(--warn-fg);padding:6px 16px;font-weight:600;font-size:13px}.warn:empty{display:none}
header{padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:16px;margin:0 8px 0 0}
label{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:13px}
select{font:inherit;padding:2px 4px;max-width:22em}
button{font:inherit;padding:3px 10px;border:1px solid var(--line);border-radius:5px;background:var(--panel);cursor:pointer}button:hover{background:var(--bg)}
main{flex:1;display:flex;min-height:0}
#banner{padding:6px 16px 7px 12px;border-bottom:1px solid var(--line);background:var(--panel);border-left:6px solid #444}#btitle{font-size:20px;font-weight:700;line-height:1.25}#bsub{font-size:13px;color:#5d646c}
#map{flex:1;min-height:300px;background:#e6e3dc}
.sl span{position:absolute;white-space:nowrap;font-size:11px;color:#4a4f55;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff;pointer-events:none}
.rk{background:none;border:none;font-size:11px;font-weight:700;color:#fff;text-align:center;line-height:16px}
.rk span{display:inline-block;min-width:16px;height:16px;border-radius:8px;background:#222;padding:0 4px;white-space:nowrap}
#panel{width:340px;overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:10px 14px;font-size:12.5px}
#panel h2{font-size:13px;margin:12px 0 4px}#panel h2:first-child{margin-top:0}
#panel table{border-collapse:collapse;width:100%}#panel td,#panel th{text-align:left;vertical-align:top;padding:2px 6px 2px 0;border-bottom:1px solid #eeece8}
#panel th{font-weight:600;color:var(--muted)}#panel .n{text-align:right;font-variant-numeric:tabular-nums}
.gl{border-bottom:1px dotted currentColor;cursor:help}#panel .note{color:var(--muted)}#panel tr.on td{background:var(--hi)}
#tip{position:fixed;z-index:10000;max-width:20rem;background:var(--fg);color:#fff;padding:5px 8px;border-radius:4px;font-size:12px;line-height:1.35;pointer-events:none}
#panel tr[data-go]{cursor:pointer}#panel tr[data-go]:hover td{background:#f3f1ec}
#panel details{margin-top:12px}#panel summary{cursor:pointer;font-weight:600}
.figs{margin:2px 0 8px;border:1px solid var(--line);border-radius:6px}.fig{display:flex;gap:10px;align-items:baseline;padding:5px 10px;border-bottom:1px solid var(--line)}.fig:last-child{border-bottom:0}
.fig b{font-size:20px;line-height:1.2;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}.fig span{color:var(--muted);line-height:1.3}
.tm{display:inline-block;border-radius:8px;padding:0 5px;font-size:11px;font-weight:700;white-space:nowrap}
#ptitle,#pkey{display:none}
.leaflet-control-layers{font-size:12px}
.leaflet-tile-pane{filter:grayscale(1) contrast(.85) brightness(1.08)}
.legend{background:var(--panel);padding:8px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:12px;line-height:1.5;max-width:250px}
.legend b{display:block;margin-top:4px}.legend b:first-child{margin-top:0}
.legend summary{cursor:pointer;font-weight:700;list-style-position:inside}.legend details[open] summary{margin-bottom:4px}
.legend .kb{max-height:calc(100vh - 260px);overflow-y:auto}
.sw{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.sq{display:inline-block;width:12px;height:12px;vertical-align:middle;margin-right:6px;border:1px solid rgba(0,0,0,.15)}
.pop h3{margin:0 0 4px;font-size:14px}.pop table{border-collapse:collapse;margin-top:4px}.pop td{padding:1px 8px 1px 0;font-size:12.5px}.pop .n{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:760px){main{flex-direction:column}#map{min-height:60vh}#panel{width:auto;border-left:0;border-top:1px solid var(--line);max-height:40vh}}
body.printing main{display:block}
body.printing #map{width:10.2in;height:5.5in;flex:none;border:1px solid #999}
body.printing .leaflet-control-attribution{display:none}
@media print{
  @page{size:landscape;margin:.35in}
  html,body{height:auto;display:block;background:#fff}
  header,.leaflet-control-layers,.leaflet-control-zoom{display:none!important}
  #ptitle{display:block;margin:0 0 6px;font-size:12px}#ptitle h1{font-size:15px;margin:0 0 2px}
  .warn{padding:4px 8px}
  main{display:block}
  #map{width:10.2in;height:5.5in;flex:none}
  #panel{width:auto;max-height:none;overflow:visible;border:0;padding:8px 0 0;font-size:11px;columns:2;column-gap:24px}
  #panel tr{break-inside:avoid}#panel h2{break-after:avoid}
  #tip,.leaflet-popup-pane,.leaflet-control-container .legend{display:none!important}
  #pkey{display:block;columns:4;column-gap:14px;font-size:10px;line-height:1.3;margin-top:5px}
  #pkey b{display:block;margin-top:3px;break-after:avoid}
  #pkey .sw{width:14px;margin-right:4px}
}
</style></head><body>
<div class="warn">/*WARN*/</div>
<div id="ptitle"><h1>/*TITLE*/</h1><div id="pfilters"></div><div class="note">/*NOTCOUNTS*/ Data: /*CREDITS*/.</div></div>
<header>
<h1>/*TITLE*/</h1>
<label id="modewrap">Getting there by <select id="mode"></select></label>
<label id="runwrap" title="The rules used to pick each route: how much extra each preset charges for busy streets, hills, crossings and turns">Route model <select id="run"></select></label>
<label id="limitwrap" title="The longest trip counted. A shorter limit drops homes and routes past it and splits the trips again; barriers are worked out at the full limit only">Time limit <select id="limit"></select></label>
<label id="flowwrap" title="Line width: how many people would use each street (potential flow, not counts)"><input type="checkbox" id="showflow" checked> Trips</label>
<label id="cellswrap" title="Shading: the median trip time from the homes in each area"><input type="checkbox" id="showcells" checked> Travel time</label>
<label id="exposurewrap" title="Priority places, and places to watch"><input type="checkbox" id="showexposure"> Where routes meet risk</label>
<label id="screenwrap" title="Barriers: where a change would open new routes"><input type="checkbox" id="showscreen"> Barriers</label>
<label id="agreewrap" title="Streets busy under every route model, or under only some"><input type="checkbox" id="showagree"> Model agreement</label>
<label id="overlapwrap" title="Streets with both car trips and this mode's trips"><input type="checkbox" id="showoverlap"> Car overlap</label>
<label id="crashwrap" title="Another model's forecast of police-recorded bike crashes at corners (bike-safety-ca); not used in this map's routes or lists"><input type="checkbox" id="showcrash"> Crash forecast</label>
<label id="crasheswrap" title="Bike crashes in police reports (California SWITRS); not used in this map's routes or lists"><input type="checkbox" id="showcrashes"> Recorded crashes</label>
<label id="outlinewrap"><input type="checkbox" id="showoutline" checked> <span id="outlinelab">attendance area</span></label>
<button id="print" type="button">Print this view</button>
</header>
<div id="banner"><div id="btitle"></div><div id="bsub"></div></div>
<main><div id="map"></div><div id="pkey"></div><aside id="panel"></aside></main>
<script>
const D=/*DATA*/;const CREDITS=/*CREDITLIST*/;/*TILES*/
const L_=window.L,$=id=>document.getElementById(id);
// The page for every destination together: summed trips and the joint lists, no catchment.
const ALL=Array.isArray(D.combined),TO=ALL?"all destinations":D.name;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Escaped text with each glossary term's first use defined on hover (text.GLOSSARY).
const GL=D.glossary||{},GLK=Object.keys(GL).sort((a,b)=>b.length-a.length).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
const GLRE=GLK.length?new RegExp("(^|[^\\w-])("+GLK.join("|")+")(?![\\w-])","gi"):null;
const gl=s=>{const t=esc(s);if(!GLRE)return t;const seen=new Set();
  return t.replace(GLRE,(m,pre,w)=>{const k=w.toLowerCase();if(seen.has(k))return m;seen.add(k);return `${pre}<span class="gl" tabindex="0" title="${esc(GL[k])}">${w}</span>`;});};
const tip=(label,t)=>`<span class="gl" tabindex="0" title="${esc(t)}">${esc(label)}</span>`;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const modeColour=m=>css("--"+m)||"#444";
// Figures read the same for every reader, and as the report prints them.
const num=v=>v===null||v===undefined?"–":Number(v).toLocaleString("en-US",{maximumFractionDigits:0});
const dec=v=>v===null||v===undefined?"–":Number(v).toLocaleString("en-US",{maximumFractionDigits:1});
const MODE=/*MODES*/;
// A run with no time limit has none, however its summary says so.
const capOf=r=>{const c=r.summary.time_cap_min;return c===null||c===undefined||!isFinite(c)?null:Number(c);};
// Travel-time bands, from the summary's within_<n>_min_weight columns.
const bandsOf=s=>Object.keys(s).map(k=>/^within_([0-9.]+)_min_weight$/.exec(k)).filter(Boolean).map(m=>+m[1]).sort((a,b)=>a-b);
const SEQ=["#14574a","#2f8a6c","#6db98e","#b9dfb0","#ecefc8","#f6e2b5"],LATE="#e2c9b8",NEVER="#bdbdbd";
const VERB={walk:"walked",bike:"cycled",car:"drove"},CAN={walk:"walk",bike:"cycle",car:"drive"};
// Two choices: the mode, then one of that mode's route models (its main one first).
const modeSel=$("mode"),runSel=$("run"),limitSel=$("limit");
// A run's views at shorter time limits are runs too, with their limit set.
const limitKey=r=>r.limit===null||r.limit===undefined?"":String(r.limit);
// Car overlap is worked out at each time limit from the mode's own trips there:
// walking on the walking view, cycling on the cycling view, both on the driving view.
const overlapOf=r=>((D.overlap||{})[r.mode]||{})[limitKey(r)]||[];
const OVERLAP_WITH={walk:"walking",bike:"cycling"};
const OVERLAP={"top 1%":"#08306b","top 5%":"#2171b5","top 10%":"#9ecae1"};
function fillLimits(){const keep=limitSel.value,ofMode=D.runs.filter(r=>r.mode===modeSel.value);limitSel.replaceChildren();
  const full=ofMode.find(r=>limitKey(r)==="");const fc=full?capOf(full):null;
  for(const k of [...new Set(ofMode.map(limitKey))].sort((a,b)=>(a===""?Infinity:+a)-(b===""?Infinity:+b)).reverse()){
    const o=document.createElement("option");o.value=k;o.textContent=k===""?(fc!==null?`${dec(fc)} min`:"Full limit"):`${dec(+k)} min`;limitSel.appendChild(o);}
  limitSel.value=[...limitSel.options].some(o=>o.value===keep)?keep:"";
  $("limitwrap").style.display=limitSel.options.length>1?"":"none";}
for(const m of [...new Set(D.runs.map(r=>r.mode))]){const o=document.createElement("option");o.value=m;o.textContent=MODE[m]||m;modeSel.appendChild(o);}
function fillRuns(){const was=D.runs.find(r=>r.id===runSel.value);runSel.replaceChildren();
  for(const r of D.runs.filter(r=>r.mode===modeSel.value&&limitKey(r)===limitSel.value)){const o=document.createElement("option");o.value=r.id;o.textContent=r.preset+(r.main?" (main)":"");o.title=r.title;runSel.appendChild(o);}
  const same=was&&D.runs.find(r=>r.mode===modeSel.value&&r.preset===was.preset&&limitKey(r)===limitSel.value);if(same)runSel.value=same.id;}
fillLimits();fillRuns();
// The address may hold a view to return to; anything else in it is ignored.
const hv=location.hash.slice(1).split(","),hn=hv.slice(0,3).map(Number);
const hok=hv.length>=3&&hv.slice(0,3).every(x=>x.trim()!=="")&&hn.every(isFinite)&&Math.abs(hn[0])<=90&&Math.abs(hn[1])<=180&&hn[2]>=0&&hn[2]<=22;
let hr=null;try{hr=hv[3]?D.runs.find(r=>r.id===decodeURIComponent(hv[3]))||null:null;}catch(e){hr=null;}
if(hr){modeSel.value=hr.mode;fillLimits();limitSel.value=limitKey(hr);fillRuns();runSel.value=hr.id;}
modeSel.addEventListener("change",()=>{fillLimits();fillRuns();draw();});
limitSel.addEventListener("change",()=>{fillRuns();draw();});
const map=L_.map("map");
if(hok)map.setView([hn[0],hn[1]],hn[2]);else map.fitBounds(D.bounds);
const run=()=>D.runs.find(r=>r.id===runSel.value)||D.runs[0];
function remember(){const c=map.getCenter();history.replaceState(null,"","#"+c.lat.toFixed(5)+","+c.lng.toFixed(5)+","+map.getZoom()+","+encodeURIComponent(run().id));}
map.on("moveend",remember);
// The study's own streets as a background.
const STREETS=D.streets,LABELS=D.labels;
const SW={P:[.8,"#b9cfa6"],S:[1,"#ffffff"],L:[2.6,"#ffffff"],T:[3.6,"#fff7da"],M:[5,"#fde9a8"]},cv=L_.canvas({padding:.4,tolerance:4});
const lines=Object.keys(SW).map(k=>[k,L_.polyline(STREETS[k],{renderer:cv,color:SW[k][1],interactive:false,lineCap:"round",dashArray:k==="P"?"3 4":null})]);
const labs=L_.layerGroup(),builtin=L_.layerGroup([...lines.map(x=>x[1]),labs]).addTo(map);
map.attributionControl.addAttribution(CREDITS.map(esc).join(" | "));
const osm=TILES?L_.tileLayer(TILES,{maxZoom:19,attribution:""}):null;
if(osm)L_.control.layers({"Built-in streets":builtin,"OpenStreetMap tiles (need the internet)":osm},null,{position:"topright",collapsed:false}).addTo(map);
L_.control.scale({position:"bottomleft"}).addTo(map);
function base(){const z=map.getZoom(),f=Math.max(.35,Math.min(6,Math.pow(2,z-16)));
  for(const [k,l] of lines)l.setStyle({weight:Math.max(.6,SW[k][0]*f)});
  labs.clearLayers();if(z<16||!map.hasLayer(builtin))return;const b=map.getBounds().pad(.05);
  for(const [nm,la,lo,ang,k] of LABELS){if(!b.contains([la,lo])||(z<17&&(k==="S"||k==="L")))continue;if(z<18&&k==="S")continue;
    L_.marker([la,lo],{interactive:false,icon:L_.divIcon({className:"sl",iconSize:[0,0],html:`<span style="transform:translate(-50%,-50%) rotate(${ang}deg)">${esc(nm)}</span>`})}).addTo(labs);}}
map.on("zoomend moveend",base);base();
// Back on the built-in streets, which return on top: redraw the layers above them.
map.on("baselayerchange",()=>{base();draw();});
// Panes, bottom to top: travel-time squares, the destination, flows, screen sections.
// One canvas holds the streets, squares and flows: a printed canvas hides whatever lies
// under it, so nothing goes below it.  On it, bottom to top: travel-time squares,
// streets, flows, then agreement and overlap, read against the flows.  The
// destination and the screen's sections are drawn above it.
for(const [p,z] of [["dest",430],["crash",440],["crashes",445],["exposure",450],["screen",460]])map.createPane(p).style.zIndex=z;
const cellR=cv,flowR=cv,overR=cv;
const cellLayer=L_.layerGroup().addTo(map),agreeLayer=L_.layerGroup().addTo(map),overlapLayer=L_.layerGroup().addTo(map),flowLayer=L_.layerGroup().addTo(map),screenLayer=L_.layerGroup().addTo(map),exposureLayer=L_.layerGroup().addTo(map);
// Outlines such as an attendance area: drawn under the destination, toggled as one.
const OUTLINE_COL="#6b5300",outlineLayer=L_.layerGroup().addTo(map);
for(const o of D.outlines)for(const ring of o.rings)L_.polygon(ring,{pane:"dest",color:OUTLINE_COL,weight:3,opacity:.85,fill:false,dashArray:o.served?null:"10 6",interactive:false}).addTo(outlineLayer);
$("outlinelab").textContent=D.outlines.map(o=>o.name).join(", ")||"outlines";
// Another model's forecast of bike crashes at corners: drawn as given, used for nothing else.
const CRASH_COL="#00838f",crashLayer=L_.layerGroup(),CRASH=D.crash||[];
// Sized in four classes, the top 1%, 5% and 25% of corners and the rest:
// most corners expect very few crashes, so sizing by value made nearly all
// of them look alike.
const crashSorted=CRASH.map(c=>c[3]||0).sort((a,b)=>a-b);
const crashAt=p=>crashSorted.length?crashSorted[Math.min(crashSorted.length-1,Math.floor(p*crashSorted.length))]:0;
const CRASH_CLASSES=[[.99,12,.5,"top 1%"],[.95,8,.4,"top 5%"],[.75,5,.3,"top 25%"],[0,2.5,.2,"the rest"]].map(([p,radius,fill,label])=>({from:crashAt(p),radius,fill,label}));
const crashClass=x=>CRASH_CLASSES.find(c=>(x||0)>=c.from)||CRASH_CLASSES[CRASH_CLASSES.length-1];
const CY=D.crashYears,crashSpan=CY?`${CY[0]}–${CY[1]}`:"",crashYearsN=CY?CY[1]-CY[0]+1:null;
const one=x=>x==null?"–":x<.05?"under 0.1":x.toFixed(1);
// "About one every 3 years" reads more easily than 0.3 a year.
const perYear=x=>{if(!crashYearsN||x==null)return "";const y=x/crashYearsN;
  return y>=.95?`about ${y.toFixed(1)} a year`:y>=.05?`about one every ${Math.round(1/y)} years`:"fewer than one every 20 years";};
for(const [lat,lon,rank,expected,recorded,streets] of CRASH){
  const k=crashClass(expected),py=perYear(expected);
  const pop=`<div class="pop"><h3>Crash forecast: rank ${rank??"–"}</h3>${streets?`<div>${esc(streets)}</div>`:""}<div>Expected bike crashes${crashSpan?` in ${crashSpan}`:""}: ${one(expected)}${py?` (${py})`:""}</div><div>Recorded bike crashes${crashSpan?` in ${crashSpan}`:""}: ${recorded??"–"}</div><div class="note">bike-safety-ca's forecast of police-recorded crashes: a count, not a risk per trip. This corner is in the ${k.label} of corners on this map.</div></div>`;
  L_.circleMarker([lat,lon],{pane:"crash",radius:k.radius,color:CRASH_COL,weight:1.5,fillColor:CRASH_COL,fillOpacity:k.fill}).bindPopup(pop).addTo(crashLayer);}
// Police-recorded bike crashes, one dot each, the worst drawn last: drawn as given, used for nothing else.
const crashesLayer=L_.layerGroup(),CRASHES=D.crashes||[],BAD=new Set(["killed","severe injury"]);
const years=CRASHES.flatMap(c=>c[2].map(x=>x[0])).filter(y=>y!=null),yearSpan=years.length?`${Math.min(...years)}–${Math.max(...years)}`:"";
for(const [lat,lon,here] of CRASHES){
  const bad=here.some(c=>BAD.has(c[1])),n=here.length;
  const rows=here.map(([year,severity,rider])=>`<div>${year??"Year not recorded"}: ${esc(severity)}; rider ${esc(rider)}</div>`).join("");
  const pop=`<div class="pop"><h3>${n===1?"Bike crash":`${n} bike crashes here`}</h3>${rows}<div class="note">From police reports${yearSpan?` for ${yearSpan}`:""}. A dot shows where crashes happened, not how risky a place is: busier places see more crashes.</div></div>`;
  L_.circleMarker([lat,lon],{pane:"crashes",radius:(bad?5.5:3.5)+2*(Math.sqrt(n)-1),color:"#fff",weight:1,fillColor:CRASH_COL,fillOpacity:bad?1:.75}).bindPopup(pop).addTo(crashesLayer);}
const destStyle={pane:"dest",color:"#111",weight:2.5,fill:false,dashArray:"6 4",interactive:false};
for(const o of D.places||[D.outline]){if(o.point)L_.circleMarker(o.point,{...destStyle,radius:9,dashArray:null,fill:true,fillColor:"#fff",fillOpacity:.9}).addTo(map);
else L_.polygon(o.rings,destStyle).addTo(map);}
for(const e of D.entrances)L_.circleMarker(e,{pane:"dest",radius:4,color:"#111",weight:1.5,fillColor:"#ffe066",fillOpacity:1,interactive:false}).addTo(map);
const FLOW=D.runs.map(r=>new Map(r.flow));
function edgePopup(i){const rows=D.runs.map((r,k)=>limitKey(r)!==limitKey(run())?"":`<tr${r.id===run().id?' style="font-weight:700"':""}><td>${esc(MODE[r.mode]||r.mode)}, ${esc(r.preset)}</td><td class="n">${dec(FLOW[k].get(i)||0)}</td></tr>`).join("");
  return `<div class="pop"><h3>${esc(D.edges.n[i]||"Unnamed street or path")}</h3><div>Potential flow, ${esc(run().unit)}</div><table>${rows}</table></div>`;}
// Colours for the bands up to the time limit; over it, its own colour.
const shownBands=(bands,cap)=>bands.filter(b=>cap===null||b<=cap);
function band(min,bands,cap){if(min===null)return NEVER;if(cap!==null&&min>cap)return LATE;
  for(let i=0;i<bands.length;i++)if(min<=bands[i])return SEQ[Math.min(i,SEQ.length-1)];return SEQ[Math.min(bands.length,SEQ.length-1)];}
function draw(){
  const r=run(),col=modeColour(r.mode),cap=capOf(r),bands=shownBands(bandsOf(r.summary),cap);
  for(const k in PLACE)delete PLACE[k];BADGES.length=0;
  cellLayer.clearLayers();flowLayer.clearLayers();agreeLayer.clearLayers();overlapLayer.clearLayers();screenLayer.clearLayers();exposureLayer.clearLayers();
  if($("showexposure").checked)for(const e of r.exposure){const first=e.tier==="priority",c=first?TIER_COL["priority"]:TIER_COL.watch,
    pop=`<div class="pop"><h3>${esc(e.tag)}. ${esc(e.label)}</h3><div>${e.kind==="street"?"Along the street":"Crossing"}: ${esc(e.people)} ${esc(r.flow_words)}${e.kind==="street"?` at the busiest point, over ${esc(e.length)}`:""}</div><div><b>${gl(e.reason||e.tier)}</b></div><div>${gl(`Why ${e.points} risk points: ${e.factors}`)}</div>${e.from?`<div>From each destination: ${esc(e.from)}</div>`:""}</div>`;
    const drawn=[];

(function(){const t=document.body.appendChild(document.createElement("div"));t.id="tip";t.setAttribute("role","tooltip");t.hidden=true;
function show(e){const el=e.target.closest&&e.target.closest("[title],[data-tip]");if(!el||el.tagName==="OPTION"||el.tagName==="SELECT")return;
  if(el.hasAttribute("title")){el.dataset.tip=el.title;el.removeAttribute("title");}
  if(!el.dataset.tip)return;t.textContent=el.dataset.tip;t.hidden=false;const r=el.getBoundingClientRect();
  t.style.left=Math.max(8,Math.min(r.left,innerWidth-t.offsetWidth-8))+"px";
  t.style.top=(r.bottom+6+t.offsetHeight>innerHeight?r.top-6-t.offsetHeight:r.bottom+6)+"px";}
function hide(){t.hidden=true;}
["mouseover","focusin"].forEach(n=>document.addEventListener(n,show));
["mouseout","focusout"].forEach(n=>document.addEventListener(n,hide));
document.addEventListener("scroll",hide,true);addEventListener("wheel",hide,{passive:true});})();
