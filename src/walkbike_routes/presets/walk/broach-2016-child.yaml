name: broach-2016-child
mode: walk
kind: broach_walk_2016
title: Children's walking after the Portland route-choice model, with twice its busy-street, crossing and sidewalk penalties (uncalibrated)
source: >-
  An assumption, not estimated from observed route choice: no route-choice
  model estimated for children was found. As walk/broach-2016, with its
  busy-street and crossing terms doubled (stress_scale 2), and the sidewalk
  term of walk/broach-2016-sidewalks doubled: links on collectors and major
  roads without sidewalk evidence count as 2 times their length (1 + 2 x
  0.5, after Lue 2017, Toronto), and local streets, paths and crossings as
  1, since many quiet residential streets have no sidewalk and children
  walk them. Flat speed 2.5 mph (4.0 km/h), after Dessing, D., de Vries, S. I.,
  Graham, J. M. and Pierik, F. H. (2014), "Active transport between home and
  school assessed with GPS: a cross-sectional study among Dutch elementary
  school children", BMC Public Health 14, 227, Table 2: an average of
  4.1 km/h on GPS-recorded walking trips of children aged 5 to 11, door to
  door, so including some stops. No
  street is ruled out. The adult model:
  Broach, J. (2016), "Travel mode choice framework incorporating realistic
  bike and walk routes", PhD dissertation, Portland State University, Table
  10 (variables defined in Table 9): a path-size logit estimated on 1,167
  GPS-recorded walk trip stages by 283 Portland, Oregon adults, 2010-2013.
  Coefficients as printed, per metre of route or per count. Neighborhood
  commercial frontage is not known here and is left out; the traveling
  together term applies only with together: true. The model's expanded path
  size is approximated by the ordinary path size. The model has no sidewalk
  or signal-delay term (see walkbike_routes.network.broach_walk and
  docs/assumptions.md). Walking speed, signal waits and slowing on hills
  are for travel time only. Signal waits across and along a main road (primary, trunk or
  secondary) use the Highway Capacity Manual's average pedestrian delay,
  (C - g)^2 / 2C, with an assumed 120 s cycle: crossing the main road,
  about 11 s of usable walk time gives 50 s; along it, about 60 s gives
  15 s; other signals 30 s. The timings are assumptions, not measured. On hills, walking speed changes with grade by Tobler's hiking
  function (Tobler, W. 1993, "Three presentations on geographical analysis
  and modeling", National Center for Geographic Information and Analysis
  Technical Report 93-1), fitted to Eduard Imhof's Swiss walking data, as a
  ratio to its flat speed.
objective: generalized_cost_s
parameters:
  together: false
  speed_mph: 2.5
  stress_scale: 2.0
  unknown_collector_factor: 2.0
  unknown_major_factor: 2.0
  signal_wait_s: 30
  signal_wait_cross_arterial_s: 50
  signal_wait_along_arterial_s: 15
  grade_speeds: true
  coefficients:
    distance_m: -0.015
    distance_together_m: -0.013
    turns: -0.809
    steep_upslope_m: -0.015
    substandard_m: -0.008
    busy_m: -0.002
    commercial_m: 0.004
    unsignalised_arterial_crossings: -1.090
    unmarked_collector_crossings: -0.419
    ln_path_size: 0.128
