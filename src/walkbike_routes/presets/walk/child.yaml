name: child
mode: walk
kind: pedestrian_evidence
title: Children's walking, avoiding streets without sidewalks and slowed on hills (uncalibrated)
source: >-
  An assumption, not estimated from observed route choice: no route-choice
  model estimated for children was found. As walk/legacy-hills, but no street
  is ruled out for stress, and links without sidewalk or crossing evidence
  cost more: distance times 1.5 on local streets, 4 on collectors and other
  links, and 12 on major roads, about twice the adult penalties. A link
  known to be poor (no sidewalk, or an unmarked or uncontrolled crossing)
  costs the same as an unknown one of its class.
  The flat speed, 2.5 mph (4.0 km/h), follows Dessing, D., de Vries, S. I.,
  Graham, J. M. and Pierik, F. H. (2014), "Active transport between home and
  school assessed with GPS: a cross-sectional study among Dutch elementary
  school children", BMC Public Health 14, 227, Table 2: an average of
  4.1 km/h on GPS-recorded walking trips of children aged 5 to 11, door to
  door, so including some stops.
  Walking speed changes with grade as in walk/legacy-hills (Tobler 1993, as
  a ratio to the flat speed).
objective: generalized_cost_s
parameters:
  speed_mph: 2.5
  signal_wait_s: 30
  signal_wait_cross_arterial_s: 50
  signal_wait_along_arterial_s: 15
  allow_unknown_local: true
  allow_unknown_collector: true
  allow_unknown_major: true
  allow_problematic: true
  unknown_local_factor: 1.5
  unknown_collector_factor: 4.0
  unknown_other_factor: 4.0
  unknown_major_factor: 12.0
  grade_speeds: true
