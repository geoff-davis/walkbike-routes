    left_turn_unsignalised_20k_plus_per_mi: -1.87
    unsignalised_cross_10k_plus_right_turn_per_mi: -0.338
    unsignalised_cross_5_10k_per_mi: -0.363
    unsignalised_cross_10_20k_per_mi: -0.516
    unsignalised_cross_20k_plus_per_mi: -2.51
    bike_boulevard: 1.03
