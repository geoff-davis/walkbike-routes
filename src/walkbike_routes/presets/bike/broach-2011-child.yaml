name: broach-2011-child
mode: bike
kind: broach_2011
title: Children's cycling after the Portland route-choice model, with twice its traffic and crossing penalties (uncalibrated)
source: >-
  An assumption, not estimated from observed route choice: no route-choice
  model estimated for children was found. As bike/broach-2011, with its
  busy-traffic terms and its terms for turns and crossings without a signal
  doubled (stress_scale 2), as bike/child roughly doubles the adult penalties
  on stressful streets (after Mekuria, Furth and Nixon 2012), and a flat
  speed of 6 mph as in bike/child (Dessing et al. 2014). No street is ruled
  out. A painted lane removes only a quarter of the busy-traffic term
  (lane_traffic_relief 0.25), where the adult model's lanes remove all of
  it: Copenhagen riders, a broader mix than Portland's, valued paint on a
  large road at about a quarter of the penalty and not significantly above
  zero (Fosgerau et al. 2023, Table 4), and lanes leave riders exposed to
  turning cars at intersections. A protected lane removes all of it. Hills cost as in the model and do not change travel time. The adult
  model:
  Broach, J., Gliebe, J. and Dill, J. (2011), "Bicycle route choice model
  developed using revealed preference GPS data", 90th Annual Meeting of the
  Transportation Research Board, Table 2: a path-size logit estimated on
  1,449 GPS-recorded trips by Portland, Oregon cyclists, 2007. Coefficients
  as printed; commute terms are used only when trip is commute. The
  published version (Transportation Research Part A 46(10), 1730-1740,
  2012) was not available to check and may differ. Traffic volumes come
  from counts where matched, else road class; the bridge terms are not used (see
  walkbike_routes.network.broach and docs/assumptions.md). Speed and signal
  waits, for travel time only, are as in bike/legacy. Not in the paper: a protected lane
  (separated track) removes the whole busy-traffic term and counts as 0.72
  times the same street with a painted lane that does the same, after Fosgerau, M., Łukawska, M., Paulsen, M. and Rasmussen, T. K.
  (2023), "Bikeability and the induced demand for cycling", PNAS 120(16),
  e2220515120, Table 4 (Copenhagen GPS trips: a protected lane on a large
  road against a painted one, 0.772/1.080); see docs/assumptions.md.
objective: generalized_cost_s
parameters:
  trip: noncommute
  speed_mph: 6.0
  stress_scale: 2.0
  lane_traffic_relief: 0.25
  protected_factor: 0.72
  signal_wait_s: 20
