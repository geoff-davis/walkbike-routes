name: child
mode: bike
kind: lts_factors
title: Children's cycling, avoiding stressful streets and slowed uphill (uncalibrated)
source: >-
  An assumption, not estimated from observed route choice: no route-choice
  model estimated for children was found. As bike/legacy-hills, with steeper
  distance multipliers for traffic stress levels 1 to 4 (Mekuria, Furth and
  Nixon 2012): 1, 1.5, 6 and 20, about twice the adult penalty on levels 3
  and 4. Furth describes level 1 as suitable for children (Level of
  Traffic Stress page, peterfurth.sites.northeastern.edu). No street is ruled out for stress, so a child still uses a short busy stretch when the way
  round is much longer.
  The flat speed, 6 mph, is a judgment. Dessing, D., de Vries, S. I., Graham,
  J. M. and Pierik, F. H. (2014), "Active transport between home and school
  assessed with GPS: a cross-sectional study among Dutch elementary school
  children", BMC Public Health 14, 227, Table 2, found an average of 6.8 km/h
  (4.2 mph) on GPS-recorded cycling trips of children aged 5 to 11, but door
  to door over short trips (624 m on average), with stops included; waits
  here are modelled separately.
  Riding speed changes with grade as in bike/legacy-hills (Parkin and
  Rotheram 2010, as a ratio to the flat speed).
objective: generalized_cost_s
parameters:
  speed_mph: 6.0
  signal_wait_s: 20
  signal_wait_cross_arterial_s: 40
  signal_wait_along_arterial_s: 15
  lts_cost_factors: [1.0, 1.5, 6.0, 20.0]
  unknown_crossing_cost_s: 15
  uncontrolled_crossing_cost_s: 30
  grade_speeds: true
