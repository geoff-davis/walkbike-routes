name: shortest
mode: bike
kind: lts_factors
title: Shortest distance by bike, ignoring traffic stress
source: >-
  A baseline for comparison, not a model of how people ride: every link a
  bike may use counts at its length, whatever its traffic stress. Riding
  speed is a flat 10 mph. Signal waits across and along a main road (primary, trunk or
  secondary) use the Highway Capacity Manual's average delay, (C - g)^2 /
  2C, with an assumed 120 s cycle: crossing the main road, about 25 s of
  side-street green gives 40 s (rounded up); along it, about 60 s gives
  15 s; other signals 20 s. The timings are assumptions, not measured. Speed and waits set travel
  times but not the route.
objective: physical_length_m
parameters:
  speed_mph: 10.0
  signal_wait_s: 20
  signal_wait_cross_arterial_s: 40
  signal_wait_along_arterial_s: 15
  lts_cost_factors: [1.0, 1.0, 1.0, 1.0]
