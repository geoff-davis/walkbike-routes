    name: Almond Elementary School
    kind: point
    purpose: school
    location: [-122.101000, 37.384700]
    min_age: 4   # TK to grade 6
    max_age: 11
    access_points:
      - [-122.101463, 37.384955]  # west drive gate, Almond Avenue
      - [-122.101150, 37.384862]  # Almond Avenue walk-in gate
      - [-122.100723, 37.384959]  # east drive gate, Almond Avenue
