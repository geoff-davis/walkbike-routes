# Los Altos schools, from public data only (OpenStreetMap, Census, Overture,
# USGS): every Los Altos School District elementary and junior high school,
# Los Altos High and Mountain View High. Each school has the age group that
# attends it.
#
# Entrances: Almond, Egan and Los Altos High's are each campus's gates,
# reviewed against maps and local knowledge. The other elementary and junior
# high schools' gates were read from aerial imagery (driveways, drop-off loops
# and walkways meeting the street) and still need checking on the ground.
# Mountain View High's are the two gates OpenStreetMap shows.
#
# Elementary and junior high schools count only their attendance areas: add
# `outline:` (here or in the private los_altos_schools.local.yaml, under
# `outlines:`); with `limits: false` it is only drawn. Attendance boundaries are
# not distributed here. The two high schools' areas are not published, so
# `nearest: high` gives each home to the high school nearest it by street.
study: Los Altos schools
area:
  source: place
  place: Los Altos, California
  buffer_m: 5000  # wide enough for Mountain View High's side of the split
destinations:
