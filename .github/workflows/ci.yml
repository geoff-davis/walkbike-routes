# Action versions are pinned to exact tags; Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, types and the separate validation folder run once, not per Python.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        env:
          # Abort stalled HTTP transfers so checkout's fetch retries can run.
          GIT_HTTP_LOW_SPEED_LIMIT: "1"
          GIT_HTTP_LOW_SPEED_TIME: "60"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Sync locked environment
        run: |
          # Retry transient download failures; the last line fails the step
          # if every attempt failed.
          for i in 1 2 3; do uv sync --locked && break; echo "retry $i"; sleep 10; done
          uv sync --locked

      - name: Lint
        run: uv run --locked ruff check --output-format=github src tests scripts validation

      - name: Check formatting
        run: uv run --locked ruff format --check src tests scripts validation

      - name: Type check
        run: make typecheck

      - name: Validation folder (types and tests)
        run: |
          make validation-typecheck
          make validation-test

      - name: Dependency audit
        run: make audit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: "1"
          GIT_HTTP_LOW_SPEED_TIME: "60"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync locked environment
        run: |
          for i in 1 2 3; do uv sync --locked && break; echo "retry $i"; sleep 10; done
          uv sync --locked

      - name: Test
        run: make test

      - name: Demo town end to end
        run: make demo
